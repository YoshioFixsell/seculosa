services:
  db:
    image: postgres:18.1-alpine3.23

    restart: always

    ports:
      - 5433:5432

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}

      POSTGRES_DB: ${DB_NAME}

      POSTGRES_HOST_AUTH_METHOD: trust

    container_name: seculosadb

    volumes:
      - ./postgres:/var/lib/postgresql/data
        
  adminer:
    image: adminer

    restart: always

    ports:
      - 8080:8080
